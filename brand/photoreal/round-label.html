<!doctype html><html lang="vi"><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}svg{display:block}</style></head><body><div id="s"></div>
<script>
/* Mộc Quả round seal label (for PET jars, box lids, trays). render({name,sub,type,weight,accent,size}) -> SVG 600x600 */
const esc=s=>(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function lines(t,max){const w=t.split(' ');const L=[];let c='';for(const x of w){if((c+' '+x).trim().length>max&&c){L.push(c);c=x}else c=(c+' '+x).trim()}L.push(c);return L}
function render(o){
  const G='#C4A265',GR='#1E3A2F',IV='#FBF6EA',AC=o.accent||'#C98A2B';
  const nm=lines(o.name,o.name.length>26?15:13).slice(0,3);const fs=nm.length>2?46:nm.length>1?54:62;
  let ticks='';for(let i=0;i<72;i++){const a=i/72*Math.PI*2,dg=i*5;if(!((dg>=160&&dg<=200)||dg>=340||dg<=20))continue;ticks+=`<line x1="${300+Math.cos(a)*268}" y1="${300+Math.sin(a)*268}" x2="${300+Math.cos(a)*276}" y2="${300+Math.sin(a)*276}" stroke="${G}" stroke-width="1.6"/>`}
  const y0=318-(nm.length-1)*fs*0.5;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600"><defs>
  <path id="top" d="M 66 300 A 234 234 0 0 1 534 300"/><path id="bot" d="M 36 300 A 264 264 0 0 0 564 300"/>
  <radialGradient id="pap" cx=".45" cy=".4" r=".7"><stop offset="0" stop-color="#FFFCF3"/><stop offset="1" stop-color="#F1E7D2"/></radialGradient></defs>
  <circle cx="300" cy="300" r="296" fill="${GR}"/><circle cx="300" cy="300" r="290" fill="none" stroke="${G}" stroke-width="3"/>
  ${ticks}
  <text font-family="Be Vietnam Pro" font-weight="600" font-size="25" letter-spacing="7" fill="${G}"><textPath href="#top" startOffset="50%" text-anchor="middle">MỘC QUẢ · MOCQUA.COM</textPath></text>
  <text font-family="Be Vietnam Pro" font-weight="500" font-size="19" letter-spacing="4.5" fill="${G}"><textPath href="#bot" startOffset="50%" text-anchor="middle">QUẢ CỦA ĐẤT · QUÀ CỦA TÌNH</textPath></text>
  <circle cx="300" cy="300" r="214" fill="url(#pap)"/><circle cx="300" cy="300" r="214" fill="none" stroke="${G}" stroke-width="4"/><circle cx="300" cy="300" r="203" fill="none" stroke="${G}" stroke-width="1.2"/>
  <path d="M 112 400 A 203 203 0 0 0 488 400 Z" fill="${AC}" opacity=".95"/><path d="M 112 400 L 488 400" stroke="${G}" stroke-width="2"/>
  <g transform="translate(300 142)"><circle r="36" fill="${GR}"/><circle r="36" fill="none" stroke="${G}" stroke-width="2"/><circle r="29" fill="none" stroke="${G}" stroke-width=".8" stroke-dasharray="2 3"/><text y="9" text-anchor="middle" font-family="Cormorant Garamond" font-weight="600" font-size="26" fill="${G}">MQ</text></g>
  <text x="300" y="${y0-fs*0.95}" text-anchor="middle" font-family="Be Vietnam Pro" font-weight="600" font-size="20" letter-spacing="6" fill="${GR}" opacity=".75">${esc((o.type||'').toUpperCase())}</text>
  ${nm.map((l,i)=>`<text x="300" y="${y0+i*fs*0.98}" text-anchor="middle" font-family="Cormorant Garamond" font-weight="700" font-size="${fs}" fill="${GR}">${esc(l)}</text>`).join('')}
  ${o.sub?`<text x="300" y="${y0+(nm.length-1)*fs*.98+40}" text-anchor="middle" font-family="Cormorant Garamond" font-style="italic" font-size="28" fill="#5E6B60">${esc(o.sub)}</text>`:''}
  <g transform="translate(300 448)"><rect x="-82" y="-27" width="164" height="50" rx="25" fill="${GR}"/><rect x="-76" y="-21" width="152" height="38" rx="19" fill="none" stroke="${G}" stroke-width="1.2"/><text y="9" text-anchor="middle" font-family="Cormorant Garamond" font-weight="700" font-size="30" letter-spacing="2" fill="${G}">${esc(o.weight)}</text></g>
  </svg>`}
window.render=render;
const q=new URLSearchParams(location.search);if(q.get('name'))document.getElementById('s').innerHTML=render(Object.fromEntries(q));
</script></body></html>
